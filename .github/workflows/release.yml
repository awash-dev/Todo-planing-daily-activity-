name: Build and Release Ionic Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Ionic Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Ionic & Capacitor CLI
        run: npm install -g @ionic/cli @capacitor/cli

      - name: Add Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/android
          npx cap add android
          npx cap copy android

      - name: Build Android APK with Ionic & Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: latest
          name: "Latest Mobile App Build (APK)"
          body: "Automated Android APK build generated via Ionic and Capacitor CI/CD workflow."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
